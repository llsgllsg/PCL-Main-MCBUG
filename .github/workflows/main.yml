name: Update MC Bug Stats

on:
  schedule:
    - cron: '0 * * * *'      # 每小时整点执行一次
  workflow_dispatch:          # 让你可以手动点按钮测试

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本生成 XAML
        run: python mcbug_stats.py

      - name: 安装 sshpass（用于密码上传）
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 上传到服务器
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT || 22 }} \
              MCBugStats.xaml \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/MCBugStats.xaml
